apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dangph12/gitops-demo.git
    targetRevision: main
    path: apps/todo

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-app

  syncPolicy:
    automated: {}
