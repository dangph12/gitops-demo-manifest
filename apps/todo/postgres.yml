apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: todo-app

spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: db
          image: postgres
          env:
            - name: POSTGRES_PASSWORD
              value: "1234"
