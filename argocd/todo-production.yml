apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: todo-production
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dangph12/gitops-demo
    targetRevision: main
    path: apps/todo/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: todo-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
