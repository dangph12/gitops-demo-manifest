apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: helm-app-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dangph12/gitops-demo
    targetRevision: main
    path: apps/helm-app

    helm:
      valueFiles:
        - values/staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-app-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
